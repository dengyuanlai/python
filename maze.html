<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Maze Solver — Canvas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1e272e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #dfe6e9;
      gap: 20px;
      padding: 20px;
    }

    h1 { font-size: 1.4rem; letter-spacing: 2px; color: #74b9ff; }

    canvas {
      border: 3px solid #74b9ff;
      border-radius: 6px;
      box-shadow: 0 0 24px #74b9ff55;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 8px 22px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
      transition: opacity .2s;
    }
    button:hover { opacity: .85; }
    button:disabled { opacity: .4; cursor: not-allowed; }

    #solveBtn { background: #00b894; color: #fff; }
    #resetBtn  { background: #e17055; color: #fff; }

    .speed-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .9rem;
    }
    input[type=range] { accent-color: #74b9ff; width: 120px; cursor: pointer; }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: .82rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid #636e7250;
    }

    #status {
      font-size: .9rem;
      color: #b2bec3;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

<h1>MAZE SOLVER</h1>
<canvas id="c"></canvas>

<div class="controls">
  <button id="solveBtn">▶ Solve</button>
  <button id="resetBtn">↺ Reset</button>
  <div class="speed-wrap">
    <span>Speed</span>
    <input type="range" id="speed" min="20" max="600" value="220" />
    <span id="speedLabel">220 ms</span>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="swatch" style="background:#2d3436"></div>Wall</div>
  <div class="legend-item"><div class="swatch" style="background:#f5f6fa"></div>Open</div>
  <div class="legend-item"><div class="swatch" style="background:#00b894"></div>Start</div>
  <div class="legend-item"><div class="swatch" style="background:#e17055"></div>End</div>
  <div class="legend-item"><div class="swatch" style="background:#fdcb6e"></div>Exploring</div>
  <div class="legend-item"><div class="swatch" style="background:#74b9ff"></div>Path</div>
  <div class="legend-item"><div class="swatch" style="background:#fd79a8"></div>Dead end</div>
</div>

<div id="status">Press ▶ Solve to start.</div>

<script>
// ─── Maze data (10 × 10) ──────────────────────────────────────────────────
const ORIGINAL = [
  ['#','#','#','#','#','#','#','#','#','#'],
  ['#','S',' ',' ','#',' ',' ',' ','E','#'],
  ['#','#','#',' ','#',' ','#','#',' ','#'],
  ['#',' ',' ',' ',' ',' ','#',' ',' ','#'],
  ['#',' ','#','#','#',' ','#',' ','#','#'],
  ['#',' ','#',' ',' ',' ',' ',' ','#','#'],
  ['#',' ','#',' ','#','#','#',' ',' ','#'],
  ['#',' ',' ',' ','#',' ',' ',' ',' ','#'],
  ['#','#','#',' ','#',' ','#','#',' ','#'],
  ['#','#','#','#','#','#','#','#','#','#'],
];

// ─── Canvas setup ────────────────────────────────────────────────────────────
const ROWS = ORIGINAL.length;
const COLS = ORIGINAL[0].length;
const CELL = 56;
const canvas = document.getElementById('c');
canvas.width  = COLS * CELL;
canvas.height = ROWS * CELL;
const ctx = canvas.getContext('2d');

// ─── Color map ───────────────────────────────────────────────────────────────
const COLORS = {
  '#': '#2d3436',   // wall
  ' ': '#f5f6fa',   // open
  'S': '#00b894',   // start
  'E': '#e17055',   // end
  '.': '#74b9ff',   // solution path
  'X': '#fd79a8',   // dead end
  '*': '#fdcb6e',   // currently exploring
};

// ─── State ───────────────────────────────────────────────────────────────────
let maze = [];           // working copy
let solving = false;
let currentCell = null;  // {r, c} – highlighted during exploration

function deepCopy(m) { return m.map(r => [...r]); }

// ─── Draw ─────────────────────────────────────────────────────────────────────
function draw() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = maze[r][c];
      const isCurrent = currentCell && currentCell.r === r && currentCell.c === c;
      const color = isCurrent ? COLORS['*'] : (COLORS[cell] ?? '#f5f6fa');

      const x = c * CELL;
      const y = r * CELL;

      ctx.fillStyle = color;
      ctx.fillRect(x, y, CELL, CELL);

      // subtle grid line
      ctx.strokeStyle = '#1e272e';
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, CELL, CELL);

      // label S / E
      if (cell === 'S' || cell === 'E') {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.floor(CELL * 0.42)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(cell, x + CELL / 2, y + CELL / 2);
      }
    }
  }
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function getDelay() { return parseInt(document.getElementById('speed').value, 10); }
function sleep(ms)  { return new Promise(r => setTimeout(r, ms)); }

function findPos(grid, ch) {
  for (let r = 0; r < grid.length; r++)
    for (let c = 0; c < grid[r].length; c++)
      if (grid[r][c] === ch) return [r, c];
  return null;
}

// ─── Recursive solver (async, same logic as Python version) ──────────────────
async function solve(r, c, end) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;

  const cell = maze[r][c];
  if (cell === '#' || cell === '.' || cell === 'X') return false;

  currentCell = { r, c };
  draw();
  await sleep(getDelay());

  if (r === end[0] && c === end[1]) {
    maze[r][c] = 'E';
    currentCell = null;
    draw();
    return true;
  }

  if (cell !== 'S') maze[r][c] = '.';
  draw();
  await sleep(getDelay());

  const dirs = [[1,0],[0,1],[-1,0],[0,-1]]; // down, right, up, left
  for (const [dr, dc] of dirs) {
    if (await solve(r + dr, c + dc, end)) return true;
  }

  if (cell !== 'S') {
    maze[r][c] = 'X';
    currentCell = null;
    draw();
    await sleep(getDelay());
  }
  return false;
}

// ─── Controls ────────────────────────────────────────────────────────────────
async function startSolve() {
  if (solving) return;
  solving = true;
  document.getElementById('solveBtn').disabled = true;
  document.getElementById('status').textContent = 'Solving…';

  const start = findPos(maze, 'S');
  const end   = findPos(maze, 'E');

  const found = await solve(start[0], start[1], end);

  currentCell = null;
  draw();
  document.getElementById('status').textContent =
    found ? '✓ Path found!' : '✗ No solution.';
  solving = false;
}

function reset() {
  if (solving) return;
  maze = deepCopy(ORIGINAL);
  currentCell = null;
  draw();
  document.getElementById('status').textContent = 'Press ▶ Solve to start.';
  document.getElementById('solveBtn').disabled = false;
}

document.getElementById('solveBtn').addEventListener('click', startSolve);
document.getElementById('resetBtn').addEventListener('click', reset);

const speedSlider = document.getElementById('speed');
const speedLabel  = document.getElementById('speedLabel');
speedSlider.addEventListener('input', () => {
  speedLabel.textContent = speedSlider.value + ' ms';
});

// ─── Init ─────────────────────────────────────────────────────────────────────
reset();
</script>
</body>
</html>
